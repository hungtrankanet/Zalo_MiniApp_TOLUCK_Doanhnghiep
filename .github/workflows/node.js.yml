name: "TOLUCK - Phòng Marketing Thuê Ngoài"
run-name: ${{ github.event_name == 'schedule' && '✨ Refresh token' || '🚀 Deploy' }}

concurrency: zalo-mini-app

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main
      - "feat/**"
  schedule:
    - cron: "0 0 * * *"

jobs:
  refresh_token:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: "npm"
      - run: npx zmp-developer-token login ${{ secrets.ZALO_APP_ID }} ${{ secrets.ZALO_APP_SECRET }} ${{ secrets.ZALO_REFRESH_TOKEN }} >> $GITHUB_ENV
      - uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: "ZALO_ACCESS_TOKEN"
          value: ${{ env.NEW_ACCESS_TOKEN }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: "ZALO_REFRESH_TOKEN"
          value: ${{ env.NEW_REFRESH_TOKEN }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Report
        run: |
          echo "### Token renewal success! :sparkles:" >> $GITHUB_STEP_SUMMARY

  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        mini-app-id: ["1216604827735341784"]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: "npm"
      - run: npm install
      - run: npm install -g zmp-cli
      - name: Authenticate Zalo Developer
        run: |
          if [ -n "${{ secrets.ZMP_TOKEN }}" ]; then
            echo "Direct ZMP_TOKEN secret detected. Deploying directly without intermediate login."
            echo "ZMP_TOKEN=${{ secrets.ZMP_TOKEN }}" >> $GITHUB_ENV
            exit 0
          fi
          LOGIN_SUCCESS=0
          if [ -n "${{ secrets.ZALO_APP_ID }}" ] && [ -n "${{ secrets.ZALO_APP_SECRET }}" ] && [ -n "${{ secrets.ZALO_REFRESH_TOKEN }}" ]; then
            echo "Requesting fresh Access Token from Zalo Developer credentials..."
            if npx zmp-developer-token login ${{ secrets.ZALO_APP_ID }} ${{ secrets.ZALO_APP_SECRET }} ${{ secrets.ZALO_REFRESH_TOKEN }} >> $GITHUB_ENV; then
              echo "Token refresh successful!"
              LOGIN_SUCCESS=1
            else
              echo "::warning::ZALO_REFRESH_TOKEN không hợp lệ hoặc đã hết hạn/đã sử dụng."
            fi
          fi
          if [ $LOGIN_SUCCESS -eq 0 ]; then
            if [ -n "${{ secrets.ZALO_ACCESS_TOKEN }}" ]; then
              echo "Using static ZALO_ACCESS_TOKEN secret as fallback..."
              echo "NEW_ACCESS_TOKEN=${{ secrets.ZALO_ACCESS_TOKEN }}" >> $GITHUB_ENV
            else
              echo "::error::Không thể xác thực Zalo Developer! Vui lòng cung cấp ZMP_TOKEN hoặc ZALO_REFRESH_TOKEN trong GitHub Secrets."
              exit 1
            fi
          fi

      - name: Deploy Mini App
        run: |
          echo "Preparing .env configuration for zmp-cli..."
          echo "APP_ID=${{ matrix.mini-app-id }}" > .env
          if [ -n "${{ secrets.ZMP_TOKEN }}" ]; then
            echo "ZMP_TOKEN=${{ secrets.ZMP_TOKEN }}" >> .env
          elif [ -n "${{ env.ZMP_TOKEN }}" ]; then
            echo "ZMP_TOKEN=${{ env.ZMP_TOKEN }}" >> .env
          fi

          if [ -n "${{ env.NEW_ACCESS_TOKEN }}" ] && ! grep -q "ZMP_TOKEN" .env; then
            echo "Logging in to ZMP CLI using Access Token..."
            zmp-cli login --app-id ${{ matrix.mini-app-id }} --token "${{ env.NEW_ACCESS_TOKEN }}"
          fi

          export APP_ID="${{ matrix.mini-app-id }}"
          export ZMP_TOKEN=$(grep "ZMP_TOKEN=" .env | cut -d '=' -f2-)

          echo "Deploying testing version to Zalo Mini App platform via zmp-cli..."
          zmp-cli deploy -ptm "$(git log -1 --pretty=%B)"




      - name: Update Rotating Refresh Token
        if: ${{ env.NEW_REFRESH_TOKEN != '' }}
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: "ZALO_REFRESH_TOKEN"
          value: ${{ env.NEW_REFRESH_TOKEN }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}

      - name: Update Access Token
        if: ${{ env.NEW_ACCESS_TOKEN != '' }}
        uses: hmanzur/actions-set-secret@v2.0.0
        with:
          name: "ZALO_ACCESS_TOKEN"
          value: ${{ env.NEW_ACCESS_TOKEN }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}


      - name: Report
        run: |
          echo "### Deployment success! :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View your deployment result: [Version Management](https://mini.zalo.me/miniapp/${{ matrix.mini-app-id }}/versions)" >> $GITHUB_STEP_SUMMARY

